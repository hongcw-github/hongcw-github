name: Prewarm backend

# Render 무료 인스턴스는 ~15분 미사용 시 잠들고(콜드스타트), 메모리 캐시도 사라진다.
# 13분마다 백엔드를 깨우고 대시보드 캐시를 미리 채워, 사용자가 열 때 즉시 뜨게 한다.
on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake instance + warm cache
        env:
          # GCP Cloud Run 백엔드 (secret 으로 덮어쓰려면 BACKEND_URL 설정)
          BASE: ${{ secrets.BACKEND_URL || 'https://hongcw-github-419197548925.us-east1.run.app' }}
        run: |
          curl -s -m 120 "$BASE/api/health" -o /dev/null || true
          curl -s -m 300 "$BASE/api/dashboard?days=30" -o /dev/null || true
          echo "prewarm done"
