name: Prewarm backend

# Render 무료 인스턴스는 ~15분 미사용 시 잠들고(콜드스타트), 메모리 캐시도 사라진다.
# 13분마다 백엔드를 깨우고 대시보드 캐시를 미리 채워, 사용자가 열 때 즉시 뜨게 한다.
on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake instance + warm cache
        env:
          BASE: ${{ secrets.BACKEND_URL }}
          KEY: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$BASE" ]; then
            echo "BACKEND_URL secret 이 없습니다. 건너뜀."
            exit 0
          fi
          # 1) 인스턴스 깨우기
          curl -s -m 120 "$BASE/api/health" -o /dev/null || true
          # 2) 기본 화면(30일) 캐시 채우기 (비번 있으면 헤더로 전달)
          curl -s -m 300 -H "X-Dashboard-Key: $KEY" "$BASE/api/dashboard?days=30" -o /dev/null || true
          echo "prewarm done"
