name: Prewarm backend

# 매시간 백엔드를 깨우고 모든 기간을 재빌드해 Firestore 캐시를 갱신한다.
# 사용자는 항상 Firestore 에 저장된 최신 빌드를 즉시(1초 이내) 받는다 —
# 무거운 SP-API 리포트 빌드는 이 크론(refresh=1)에서만 일어나며, 매시간
# 주기라 Cloud Run 컴퓨팅이 무료 한도 안에 머문다. (데이터는 최대 1시간 지연)
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake instance + rebuild Firestore cache
        env:
          # GCP Cloud Run 백엔드 (secret 으로 덮어쓰려면 BACKEND_URL 설정)
          BASE: ${{ secrets.BACKEND_URL || 'https://hongcw-github-419197548925.us-east1.run.app' }}
        run: |
          curl -s -m 120 "$BASE/api/health" -o /dev/null || true
          # refresh=1 로 강제 재빌드 → 각 기간의 최신 결과를 Firestore 에 저장.
          for d in 30 60 90 180 14 7; do
            curl -s -m 300 "$BASE/api/dashboard?days=$d&refresh=1" -o /dev/null || true
          done
          echo "prewarm done"
