name: Prewarm backend

# 매시간 백엔드를 깨우고 모든 기간을 재빌드해 Firestore 캐시를 갱신한다.
# 사용자는 항상 Firestore 에 저장된 최신 빌드를 즉시(1초 이내) 받는다 —
# 무거운 SP-API 리포트 빌드는 이 크론(refresh=1)에서만 일어나며, 매시간
# 주기라 Cloud Run 컴퓨팅이 무료 한도 안에 머문다. (데이터는 최대 1시간 지연)
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: seller-inventory-prewarm
      cancel-in-progress: false
    steps:
      - name: Save daily inventory independently of dashboard sections
        env:
          BASE: https://hongcw-github-419197548925.us-east1.run.app
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 15 \
            --max-time 300 --request POST \
            --header "X-Dashboard-Key: $DASHBOARD_KEY" \
            "$BASE/api/inventory/snapshot"
      - name: Wake instance + rebuild Firestore cache
        env:
          BASE: https://hongcw-github-419197548925.us-east1.run.app
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: |
          curl -fsS -m 120 "$BASE/api/health" -o /dev/null
          # refresh=1 로 강제 재빌드 → 각 기간의 최신 결과를 Firestore 에 저장.
          failed=0
          for d in 30 60 90 180 14 7; do
            curl -fsS -m 300 --header "X-Dashboard-Key: $DASHBOARD_KEY" \
              "$BASE/api/dashboard?days=$d&refresh=1" -o /dev/null || failed=1
          done
          exit "$failed"
